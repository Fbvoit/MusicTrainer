<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Trainer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <nav class="nav">
            <a href="#" class="nav-link active">
                Генератор
            </a>
        </nav>
    </header>


    <main class="container">

        <h1>Music Trainer</h1>


        <!-- Выбор режима -->

        <div class="mode-selector">

            <label for="modeSelect">
                Режим:
            </label>

            <select id="modeSelect">

                <option value="mode1">
                    Ступень в ладу
                </option>

                <option value="mode2">
                    Интервал от ступени в ладу
                </option>

                <option value="mode3">
                    Интервал от ступени
                </option>

                <option value="mode4">
                    Аккорд в ладу
                </option>

                <option value="mode5">
                    Случайная нота
                </option>

            </select>

        </div>


        <!-- Позиции -->

        <div id="positions" class="positions">
            <!-- Сюда JavaScript добавляет позиции -->
        </div>


        <!-- Настройки таймера -->

        <div class="timer-settings">

            <label for="timerInput">
                Интервал:
            </label>

            <input
                type="number"
                id="timerInput"
                value="5"
                min="1"
            >

            <span>сек.</span>

            <button
                id="timerButton"
                class="button"
            >
                Старт
            </button>

        </div>


        <!-- Ручное переключение -->

        <button
            id="generateButton"
            class="button"
        >
            Следующий
        </button>

    </main>


    <!--
        ВАЖНО:
        Порядок подключения файлов имеет значение.
    -->

    <script src="data/lists.js"></script>

    <script src="js/generators.js"></script>

    <script src="js/modes.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
